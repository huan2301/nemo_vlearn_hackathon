# Render Blueprint — deploys the FastAPI backend as a free Web Service.
# Usage: Render dashboard -> New -> Blueprint -> pick this repo -> Apply.
# After it's created, go to the service's "Environment" tab and fill in
# the real values for the keys marked `sync: false` below (Render will
# prompt you for these during Blueprint setup too). Never put real key
# values in this file — it's committed to git.
services:
  - type: web
    name: vlearn-ai-tutor-backend
    runtime: python
    plan: free
    rootDir: codebase/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_FALLBACK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_FALLBACK_MODEL
        value: llama-3.3-70b-lite
      - key: GEMINI_PRIMARY_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-1.5-flash-8b
